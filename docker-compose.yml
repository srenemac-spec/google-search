services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - searxng
    networks:
      - searchnet

  searxng:
    image: searxng/searxng
    ports:
      - "8080:8080"
    volumes:
      - searxng-data:/var/cache/searxng
      - ./settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - searchnet

networks:
  searchnet:
    driver: bridge

volumes:
  searxng-data: {}
